<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sunglowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Pill with Sunglow Aura -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#sunglowGrad)" filter="url(#softGlow)" />
  
  <!-- Modern Clean White Wallet Core -->
  <rect x="8" y="13" width="32" height="22" rx="6" fill="#ffffff" stroke="#fffbeb" stroke-width="1.5" />
  
  <!-- Sunglow Card Flap -->
  <path d="M8 18C8 15.2 10.2 13 13 13H35C37.8 13 40 15.2 40 18V21H8V18Z" fill="url(#goldShine)" />
  
  <!-- Golden Coin Badge -->
  <circle cx="31" cy="24" r="3.5" fill="url(#sunglowGrad)" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Upward Financial Growth Trendline -->
  <path d="M14 27L19 22L23 25L28 19" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M25 19H28V22" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
