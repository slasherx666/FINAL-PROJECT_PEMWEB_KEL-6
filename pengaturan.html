<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyBudgetGue - Pengaturan</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sunglow: {
              50: '#fffdf5',
              100: '#fffbeb',
              200: '#fef3c7',
              300: '#fde68a',
              400: '#ffc72c',
              500: '#ffb703',
              600: '#f59e0b',
              700: '#d97706',
              800: '#92400e',
              900: '#78350f'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen selection:bg-amber-200">

  <!-- ================= MOBILE APP FRAME CONTAINER ================= -->
  <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col pb-24 border-x border-slate-200/60">
    
    <!-- ================= TOP HEADER (< Pengaturan) ================= -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 py-3.5 border-b border-slate-100 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2">
        <a href="dashboard.html" class="p-1.5 rounded-xl text-slate-600 hover:bg-slate-100 active:scale-95 transition-all" aria-label="Kembali ke Dashboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <h1 class="text-base font-extrabold text-slate-900 tracking-tight">Pengaturan</h1>
      </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="flex-1 px-4 py-4 space-y-4">
      
      <form id="settingsForm" class="space-y-4">
        
        <!-- CARD 1: BATAS PENGELUARAN (SESUAI REFERENSI DESAIN) -->
        <section class="card-sunglow rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-3">
          <h3 class="text-xs font-extrabold text-slate-900 tracking-tight pb-2 border-b border-slate-100">
            Batas Pengeluaran
          </h3>

          <!-- Batas Harian -->
          <div class="space-y-1.5">
            <label for="setBatasHarian" class="block text-xs font-bold text-slate-700">Batas Harian (Rp)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-xs font-bold text-slate-400">Rp</span>
              <input 
                type="number" 
                id="setBatasHarian" 
                placeholder="mis. 100.000"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-800 placeholder-slate-400 focus:border-amber-400 shadow-2xs"
              >
            </div>
          </div>

          <!-- Batas Bulanan -->
          <div class="space-y-1.5">
            <label for="setBatasBulanan" class="block text-xs font-bold text-slate-700">Batas Bulanan (Rp)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-xs font-bold text-slate-400">Rp</span>
              <input 
                type="number" 
                id="setBatasBulanan" 
                placeholder="mis. 3.000.000"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-800 placeholder-slate-400 focus:border-amber-400 shadow-2xs"
              >
            </div>
          </div>
        </section>

        <!-- CARD 2: TARGET TABUNGAN (SESUAI REFERENSI DESAIN) -->
        <section class="card-sunglow rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-3">
          <h3 class="text-xs font-extrabold text-slate-900 tracking-tight pb-2 border-b border-slate-100">
            Target Tabungan
          </h3>

          <!-- Nominal Target -->
          <div class="space-y-1.5">
            <label for="setNominalTarget" class="block text-xs font-bold text-slate-700">Nominal Target (Rp)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-xs font-bold text-slate-400">Rp</span>
              <input 
                type="number" 
                id="setNominalTarget" 
                placeholder="mis. 10.000.000"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-800 placeholder-slate-400 focus:border-amber-400 shadow-2xs"
              >
            </div>
          </div>

          <!-- Tabungan Saat Ini -->
          <div class="space-y-1.5">
            <label for="setTabunganSaatIni" class="block text-xs font-bold text-slate-700">Tabungan Saat Ini (Rp)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-xs font-bold text-slate-400">Rp</span>
              <input 
                type="number" 
                id="setTabunganSaatIni" 
                placeholder="mis. 2.500.000"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-800 placeholder-slate-400 focus:border-amber-400 shadow-2xs"
              >
            </div>
          </div>
        </section>

        <!-- CARD 3: NOTIFIKASI PENGINGAT (SESUAI REFERENSI DESAIN) -->
        <section class="card-sunglow rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-3">
          <h3 class="text-xs font-extrabold text-slate-900 tracking-tight pb-2 border-b border-slate-100">
            Notifikasi Pengingat
          </h3>

          <!-- Aktifkan Pengingat -->
          <div class="flex items-center justify-between py-1">
            <div class="flex items-center gap-2.5">
              <span class="text-base">🔔</span>
              <div>
                <p class="text-xs font-bold text-slate-800">Aktifkan Pengingat</p>
                <span class="text-[10px] text-slate-500">Pengingat harian untuk catat keuangan</span>
              </div>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setNotifikasiAktif" class="sr-only peer" checked>
              <div class="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
            </label>
          </div>

          <!-- Waktu Pengingat (WIB) -->
          <div class="space-y-1.5 pt-1">
            <label for="setWaktuPengingat" class="block text-xs font-bold text-slate-700">Waktu Pengingat (WIB)</label>
            <input 
              type="time" 
              id="setWaktuPengingat" 
              value="20:00"
              class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-800 focus:border-amber-400 shadow-2xs"
            >
          </div>

          <!-- Push Notification Browser -->
          <div class="flex items-center justify-between py-2 border-t border-slate-100">
            <div>
              <p class="text-xs font-bold text-slate-800">Push Notification Browser</p>
              <span class="text-[10px] text-slate-500">Notifikasi langsung di browser</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setPushNotification" class="sr-only peer" checked>
              <div class="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
            </label>
          </div>

          <!-- Pengingat Email -->
          <div class="flex items-center justify-between py-2 border-t border-slate-100">
            <div>
              <p class="text-xs font-bold text-slate-800">Pengingat Email</p>
              <span class="text-[10px] text-slate-500">Kirim ke email terdaftar</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setEmailNotification" class="sr-only peer">
              <div class="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
            </label>
          </div>
        </section>

        <!-- TOMBOL SIMPAN PENGATURAN -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full btn-sunglow py-3.5 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-md cursor-pointer active:scale-98 transition-all"
          >
            Simpan Pengaturan
          </button>
        </div>

      </form>

    </main>

    <!-- ================= FIXED BOTTOM NAVIGATION BAR ================= -->
    <nav class="fixed bottom-0 left-1/2 transform -translate-x-1/2 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-6 py-2.5 z-40 flex items-center justify-between shadow-lg">
      <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-lg">⊞</span>
        <span>Dashboard</span>
      </a>
      <a href="transaksi.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-lg">📄</span>
        <span>Transaksi</span>
      </a>
      <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-lg">👤</span>
        <span>Profil</span>
      </a>
      <a href="pengaturan.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-bold text-[10px]">
        <span class="text-lg">⚙️</span>
        <span>Pengaturan</span>
      </a>
    </nav>

  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
