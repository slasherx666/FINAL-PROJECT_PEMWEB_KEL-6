<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyBudgetGue - Profil Pengguna</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sunglow: {
              50: '#fffdf5',
              100: '#fffbeb',
              200: '#fef3c7',
              300: '#fde68a',
              400: '#ffc72c',
              500: '#ffb703',
              600: '#f59e0b',
              700: '#d97706',
              800: '#92400e',
              900: '#78350f'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen selection:bg-amber-200">

  <!-- ================= MOBILE APP FRAME CONTAINER ================= -->
  <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col pb-24 border-x border-slate-200/60">
    
    <!-- ================= TOP HEADER ================= -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 py-3.5 border-b border-slate-100 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2">
        <a href="dashboard.html" class="p-1.5 rounded-xl text-slate-600 hover:bg-slate-100 active:scale-95 transition-all" aria-label="Kembali ke Dashboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <h1 class="text-base font-extrabold text-slate-900 tracking-tight">Profil Pengguna</h1>
      </div>
      <a href="auth.html" class="text-xs font-bold text-rose-600 hover:underline">Keluar</a>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="flex-1 px-4 py-4 space-y-4">
      
      <!-- CARD 1: USER PROFILE HEADER (SESUAI REFERENSI DESAIN) -->
      <section class="card-sunglow rounded-2xl p-5 border border-amber-200/80 bg-gradient-to-b from-amber-50/50 to-white flex flex-col items-center text-center shadow-xs">
        <!-- Big Initial Circle -->
        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-amber-400 to-amber-300 border-2 border-white text-2xl font-extrabold text-amber-950 flex items-center justify-center shadow-sm mb-2.5">
          D
        </div>
        
        <h2 id="profileUsername" class="text-lg font-extrabold text-slate-900">Dorasaki</h2>
        <p id="profileJoinDate" class="text-xs text-slate-400 font-medium mt-0.5">Bergabung sejak 14 Nov 2026</p>

        <!-- 3 Pill Boxes: Streak | Poin | Lencana -->
        <div class="grid grid-cols-3 gap-2.5 w-full mt-4 pt-4 border-t border-slate-100">
          <div class="bg-amber-50/70 p-2.5 rounded-2xl border border-amber-200/60">
            <span class="text-base flame-anim inline-block">🔥</span>
            <strong id="profileStreak" class="text-sm font-extrabold text-slate-900 block mt-0.5">0</strong>
            <span class="text-[10px] text-slate-500 font-medium">Streak</span>
          </div>

          <div class="bg-amber-50/70 p-2.5 rounded-2xl border border-amber-200/60">
            <span class="text-base inline-block">⭐</span>
            <strong id="profilePoin" class="text-sm font-extrabold text-slate-900 block mt-0.5">0</strong>
            <span class="text-[10px] text-slate-500 font-medium">Poin</span>
          </div>

          <div class="bg-amber-50/70 p-2.5 rounded-2xl border border-amber-200/60">
            <span class="text-base inline-block">🏆</span>
            <strong id="profileLencanaCount" class="text-sm font-extrabold text-slate-900 block mt-0.5">0</strong>
            <span class="text-[10px] text-slate-500 font-medium">Lencana</span>
          </div>
        </div>
      </section>

      <!-- CARD 2: KOLEKSI LENCANA (X/8) SESUAI REFERENSI DESAIN -->
      <section class="card-sunglow rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-3">
        <h3 id="profileBadgeHeaderTitle" class="text-xs font-extrabold text-slate-900 tracking-tight">
          Koleksi Lencana (0/8)
        </h3>

        <!-- Grid 8 Lencana (2 kolom x 4 baris di mobile) -->
        <div id="profileBadgeGrid" class="grid grid-cols-2 gap-2.5">
          <!-- Rendered via JS -->
        </div>
      </section>

      <!-- CARD 3: CARA MENDAPAT POIN SESUAI REFERENSI DESAIN -->
      <section class="card-sunglow rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-3">
        <h3 class="text-xs font-extrabold text-slate-900 tracking-tight">
          Cara Mendapat Poin
        </h3>

        <div class="space-y-2 text-xs">
          <!-- Item 1 -->
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-2">
              <span class="text-base">📝</span>
              <span class="font-bold text-slate-800">Catat transaksi</span>
            </div>
            <strong class="text-amber-800 font-extrabold bg-amber-100 px-2.5 py-0.5 rounded-full text-[11px]">+10 poin</strong>
          </div>

          <!-- Item 2 -->
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-2">
              <span class="text-base">🏅</span>
              <span class="font-bold text-slate-800">Dapatkan lencana</span>
            </div>
            <strong class="text-amber-800 font-extrabold bg-amber-100 px-2.5 py-0.5 rounded-full text-[11px]">+50 poin</strong>
          </div>

          <!-- Item 3 -->
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-2">
              <span class="text-base">🎯</span>
              <span class="font-bold text-slate-800">Capai target tabungan</span>
            </div>
            <strong class="text-amber-800 font-extrabold bg-amber-100 px-2.5 py-0.5 rounded-full text-[11px]">+100 poin</strong>
          </div>
        </div>
      </section>

    </main>

    <!-- ================= FIXED BOTTOM NAVIGATION BAR ================= -->
    <nav class="fixed bottom-0 left-1/2 transform -translate-x-1/2 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-6 py-2.5 z-40 flex items-center justify-between shadow-lg">
      <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-lg">⊞</span>
        <span>Dashboard</span>
      </a>
      <a href="transaksi.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-lg">📄</span>
        <span>Transaksi</span>
      </a>
      <a href="profil.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-bold text-[10px]">
        <span class="text-lg">👤</span>
        <span>Profil</span>
      </a>
      <a href="pengaturan.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-lg">⚙️</span>
        <span>Pengaturan</span>
      </a>
    </nav>

  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
