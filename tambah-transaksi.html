<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyBudgetGue - Catat Transaksi</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sunglow: {
              50: '#fffdf5',
              100: '#fffbeb',
              200: '#fef3c7',
              300: '#fde68a',
              400: '#ffc72c',
              500: '#ffb703',
              600: '#f59e0b',
              700: '#d97706',
              800: '#92400e',
              900: '#78350f'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen selection:bg-amber-200">

  <!-- ================= MOBILE APP FRAME CONTAINER ================= -->
  <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col pb-24 border-x border-slate-200/60">
    
    <!-- ================= TOP HEADER (< Catat Transaksi) ================= -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 py-3.5 border-b border-slate-100 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2">
        <a href="transaksi.html" class="p-1.5 rounded-xl text-slate-600 hover:bg-slate-100 active:scale-95 transition-all" aria-label="Kembali">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <h1 class="text-base font-extrabold text-slate-900 tracking-tight">Catat Transaksi</h1>
      </div>
      <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
        +10 Poin
      </span>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="flex-1 px-4 py-4 space-y-4">
      
      <!-- FITUR 1: SHORTCUT TRANSAKSI MIKRO -->
      <section class="space-y-1.5">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-extrabold text-slate-700 flex items-center gap-1">
            <span>⚡</span> Shortcut Transaksi Mikro
          </span>
          <span class="text-[10px] text-slate-400 font-medium">Catat langsung 1-klik</span>
        </div>
        <div id="formMicroShortcutsList" class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
          <!-- Rendered via JS -->
        </div>
      </section>

      <!-- TOP CARD: CATAT DENGAN SUARA (WEB SPEECH API) SESUAI DESAIN -->
      <section class="card-sunglow rounded-2xl p-4 border border-amber-200/80 bg-gradient-to-br from-amber-50/60 via-white to-amber-50/30 shadow-xs space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-base">🎙️</span>
            <span class="text-xs font-extrabold text-slate-900">Catat dengan Suara</span>
          </div>
          <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-200">
            Web Speech API
          </span>
        </div>

        <!-- Tombol Rekam Suara In-Page -->
        <button 
          id="btnRecordInPage" 
          onclick="startVoiceInPage()" 
          type="button" 
          class="w-full bg-white hover:bg-amber-50/80 p-3 rounded-2xl border border-amber-300 flex items-center gap-3 transition-all cursor-pointer shadow-2xs active:scale-98 group text-left"
        >
          <div class="w-10 h-10 rounded-xl btn-sunglow flex items-center justify-center text-lg text-slate-900 shadow-2xs group-hover:scale-105 transition-transform flex-shrink-0">
            🎤
          </div>
          <div class="flex-1 min-w-0">
            <h5 id="voiceBoxStatus" class="text-xs font-bold text-slate-900 leading-tight">Ketuk mikrofon untuk bicara</h5>
            <p id="voiceBoxTranscript" class="text-[11px] text-slate-500 font-medium truncate mt-0.5">Contoh: "beli bensin seratus ribu"</p>
          </div>
        </button>

        <!-- Preset Chips Simulasi Suara Cepat -->
        <div class="flex flex-wrap gap-1.5 pt-1">
          <button type="button" onclick="applyVoiceToForm('Makan siang 35 ribu')" class="text-[10px] bg-white border border-slate-200 hover:border-amber-300 px-2 py-0.5 rounded-lg text-slate-600 cursor-pointer">"Makan siang 35 rb"</button>
          <button type="button" onclick="applyVoiceToForm('Beli bensin pertamax 50 ribu')" class="text-[10px] bg-white border border-slate-200 hover:border-amber-300 px-2 py-0.5 rounded-lg text-slate-600 cursor-pointer">"Bensin 50 rb"</button>
          <button type="button" onclick="applyVoiceToForm('Pemasukan freelance 1.5 juta')" class="text-[10px] bg-white border border-slate-200 hover:border-amber-300 px-2 py-0.5 rounded-lg text-slate-600 cursor-pointer">"Freelance 1.5 jt"</button>
        </div>
      </section>

      <!-- SWITCHER TABS: Pengeluaran | Pemasukan -->
      <section class="flex bg-slate-100 p-1 rounded-2xl text-xs font-bold">
        <button id="btnTypePengeluaran" onclick="setTransactionType('pengeluaran')" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold bg-rose-500 text-white shadow-xs transition-all cursor-pointer">
          💸 Pengeluaran
        </button>
        <button id="btnTypePemasukan" onclick="setTransactionType('pemasukan')" type="button" class="flex-1 py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 transition-all cursor-pointer">
          💰 Pemasukan
        </button>
      </section>

      <!-- FORM TRANSAKSI -->
      <form id="addTransactionForm" class="space-y-4">
        
        <!-- JUMLAH -->
        <div class="card-sunglow rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-1.5">
          <label for="txJumlah" class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
            JUMLAH
          </label>
          <div class="flex items-center text-slate-900 font-extrabold text-2xl">
            <span class="text-amber-500 mr-2 text-xl font-bold">Rp</span>
            <input 
              type="number" 
              id="txJumlah" 
              name="nominal" 
              min="1" 
              step="any" 
              required 
              placeholder="0"
              class="w-full bg-transparent border-0 focus:outline-none focus:ring-0 text-2xl font-extrabold text-slate-900 placeholder-slate-300 p-0"
            >
          </div>
        </div>

        <!-- KATEGORI (GRID 8 ICON) -->
        <div class="space-y-2">
          <label class="block text-xs font-bold text-slate-700">Kategori</label>
          <div id="categoryIconGrid" class="grid grid-cols-4 gap-2">
            <!-- Diisi dinamis oleh app.js -->
          </div>
        </div>

        <!-- DESKRIPSI -->
        <div class="space-y-1.5">
          <label for="txDeskripsi" class="block text-xs font-bold text-slate-700">Deskripsi</label>
          <input 
            type="text" 
            id="txDeskripsi" 
            placeholder="mis. Makan siang kantor"
            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 text-xs font-semibold text-slate-800 placeholder-slate-400 focus:border-amber-400 shadow-2xs"
          >
        </div>

        <!-- TANGGAL -->
        <div class="space-y-1.5">
          <label for="txTanggal" class="block text-xs font-bold text-slate-700">Tanggal</label>
          <input 
            type="date" 
            id="txTanggal" 
            required
            class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 text-xs font-semibold text-slate-800 focus:border-amber-400 shadow-2xs"
          >
        </div>

        <!-- CATATAN (OPSIONAL) -->
        <div class="space-y-1.5">
          <label for="txCatatan" class="block text-xs font-bold text-slate-700">Catatan (opsional)</label>
          <textarea 
            id="txCatatan" 
            rows="2" 
            placeholder="Catatan tambahan..."
            class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-xs font-medium text-slate-800 placeholder-slate-400 focus:border-amber-400 shadow-2xs resize-none"
          ></textarea>
        </div>

        <!-- TOMBOL SIMPAN TRANSAKSI (+10 POIN) -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full btn-sunglow py-3.5 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-md cursor-pointer active:scale-98 transition-all"
          >
            Simpan Transaksi (+10 Poin)
          </button>
        </div>

      </form>

    </main>

    <!-- ================= FIXED BOTTOM NAVIGATION BAR ================= -->
    <nav class="fixed bottom-0 left-1/2 transform -translate-x-1/2 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-4 py-2.5 z-40 flex items-center justify-between shadow-lg">
      <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">⊞</span>
        <span>Dashboard</span>
      </a>
      <a href="transaksi.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-bold text-[10px]">
        <span class="text-base">📄</span>
        <span>Transaksi</span>
      </a>
      <a href="analitik.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">📊</span>
        <span>Analitik</span>
      </a>
      <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">👤</span>
        <span>Profil</span>
      </a>
      <a href="pengaturan.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">⚙️</span>
        <span>Pengaturan</span>
      </a>
    </nav>

  </div>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCategoryGrid('pengeluaran');
    });
  </script>
</body>
</html>
