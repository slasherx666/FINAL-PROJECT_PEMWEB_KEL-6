<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyBudgetGue - Riwayat Transaksi</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sunglow: {
              50: '#fffdf5',
              100: '#fffbeb',
              200: '#fef3c7',
              300: '#fde68a',
              400: '#ffc72c',
              500: '#ffb703',
              600: '#f59e0b',
              700: '#d97706',
              800: '#92400e',
              900: '#78350f'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen selection:bg-amber-200">

  <!-- ================= MOBILE APP FRAME CONTAINER ================= -->
  <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col pb-24 border-x border-slate-200/60">
    
    <!-- ================= TOP HEADER (< Riwayat Transaksi | + Tambah) ================= -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 py-3.5 border-b border-slate-100 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2">
        <a href="dashboard.html" class="p-1.5 rounded-xl text-slate-600 hover:bg-slate-100 active:scale-95 transition-all" aria-label="Kembali ke Dashboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <h1 class="text-base font-extrabold text-slate-900 tracking-tight">Riwayat Transaksi</h1>
      </div>

      <a href="tambah-transaksi.html" class="btn-sunglow px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-2xs cursor-pointer active:scale-95">
        <span>+</span> Tambah
      </a>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="flex-1 px-4 py-4 space-y-4">
      
      <!-- FITUR 2: SISTEM PERINGATAN VISUAL BATAS PENGELUARAN (MINI BANNER) -->
      <section id="txVisualWarningBanner">
        <!-- Rendered via JS -->
      </section>

      <!-- 2 METRIC CARDS SEJAJAR: Total Masuk & Total Keluar -->
      <section class="grid grid-cols-2 gap-3">
        <div class="card-sunglow rounded-2xl p-4 bg-emerald-50/30 border border-emerald-100 shadow-2xs">
          <span class="text-[11px] font-bold text-emerald-800 block">Total Masuk</span>
          <strong id="txTotalMasuk" class="text-base font-extrabold text-emerald-700 mt-1 block truncate">Rp 0</strong>
        </div>

        <div class="card-sunglow rounded-2xl p-4 bg-rose-50/30 border border-rose-100 shadow-2xs">
          <span class="text-[11px] font-bold text-rose-800 block">Total Keluar</span>
          <strong id="txTotalKeluar" class="text-base font-extrabold text-rose-700 mt-1 block truncate">Rp 0</strong>
        </div>
      </section>

      <!-- FITUR 1: SHORTCUT TRANSAKSI MIKRO -->
      <section class="space-y-1.5">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-extrabold text-slate-700 flex items-center gap-1">
            <span>⚡</span> Shortcut Transaksi Mikro
          </span>
          <span class="text-[10px] text-slate-400 font-medium">Catat 1-klik</span>
        </div>
        <div id="txMicroShortcutsList" class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
          <!-- Rendered via JS -->
        </div>
      </section>

      <!-- FILTER TABS: Semua | Masuk | Keluar -->
      <section class="flex bg-slate-100 p-1 rounded-2xl text-xs font-bold text-slate-500">
        <button id="filterTabSemua" onclick="switchTxTab('semua')" type="button" class="flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-2xs font-bold transition-all cursor-pointer">
          Semua
        </button>
        <button id="filterTabMasuk" onclick="switchTxTab('masuk')" type="button" class="flex-1 py-2 rounded-xl hover:text-slate-900 transition-all cursor-pointer">
          Masuk
        </button>
        <button id="filterTabKeluar" onclick="switchTxTab('keluar')" type="button" class="flex-1 py-2 rounded-xl hover:text-slate-900 transition-all cursor-pointer">
          Keluar
        </button>
      </section>

      <!-- TRANSACTION LIST CONTAINER / EMPTY STATE -->
      <section class="card-sunglow rounded-2xl p-4 border border-slate-200/80 shadow-xs min-h-[300px] flex flex-col justify-center">
        <div id="txListContainer" class="space-y-2.5">
          <!-- Rendered via JS -->
        </div>
      </section>

    </main>

    <!-- ================= FIXED BOTTOM NAVIGATION BAR ================= -->
    <nav class="fixed bottom-0 left-1/2 transform -translate-x-1/2 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-4 py-2.5 z-40 flex items-center justify-between shadow-lg">
      <a href="dashboard.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">⊞</span>
        <span>Dashboard</span>
      </a>
      <a href="transaksi.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-bold text-[10px]">
        <span class="text-base">📄</span>
        <span>Transaksi</span>
      </a>
      <a href="analitik.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">📊</span>
        <span>Analitik</span>
      </a>
      <a href="profil.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">👤</span>
        <span>Profil</span>
      </a>
      <a href="pengaturan.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 font-semibold text-[10px]">
        <span class="text-base">⚙️</span>
        <span>Pengaturan</span>
      </a>
    </nav>

  </div>

  <script src="assets/js/app.js"></script>
  <script>
    function switchTxTab(type) {
      const tabSemua = document.getElementById('filterTabSemua');
      const tabMasuk = document.getElementById('filterTabMasuk');
      const tabKeluar = document.getElementById('filterTabKeluar');

      [tabSemua, tabMasuk, tabKeluar].forEach(t => {
        t.className = 'flex-1 py-2 rounded-xl hover:text-slate-900 transition-all cursor-pointer text-slate-500';
      });

      if (type === 'semua') tabSemua.className = 'flex-1 py-2 rounded-xl bg-white text-slate-900 shadow-2xs transition-all cursor-pointer font-bold';
      if (type === 'masuk') tabMasuk.className = 'flex-1 py-2 rounded-xl bg-white text-emerald-700 shadow-2xs transition-all cursor-pointer font-bold';
      if (type === 'keluar') tabKeluar.className = 'flex-1 py-2 rounded-xl bg-white text-rose-700 shadow-2xs transition-all cursor-pointer font-bold';

      renderFilterTransactions(type);
    }
  </script>
</body>
</html>
